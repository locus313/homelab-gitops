name: Mermaid Check

"on":
  push:
    paths:
      - '**/*.md'
      - '.github/scripts/check-mermaid.mjs'
      - '.github/workflows/mermaid-check.yml'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mermaid:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22

      - name: Install parser
        run: npm install --no-save --no-package-lock mermaid@11 jsdom

      - name: Parse Mermaid blocks
        run: git ls-files '*.md' | xargs node .github/scripts/check-mermaid.mjs
