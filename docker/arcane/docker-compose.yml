services:
  arcane:
    image: ghcr.io/getarcaneapp/manager:v3.2.0
    container_name: arcane
    restart: unless-stopped
    networks:
      - proxynet
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_BASE_PATH}/arcane/data:/app/data
      - ${DOCKER_BASE_PATH}/arcane/projects:${DOCKER_BASE_PATH}/arcane/projects
    environment:
      ARCANE_APP_URL: https://arcane.${TRAEFIK_BASE_DOMAIN}
      ARCANE_ENCRYPTION_KEY: ${ARCANE_ENCRYPTION_KEY:?Set an encryption key}
      ARCANE_FILE_PERM: "0600"
      ARCANE_PROJECTS_DIRECTORY: ${DOCKER_BASE_PATH}/arcane/projects
      ARCANE_TRUSTED_PROXIES: ${ARCANE_TRUSTED_PROXIES:?Set the Traefik proxy CIDR}
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    healthcheck:
      test: ["CMD", "./arcane", "health", "--timeout", "2s"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxynet
      - traefik.http.services.arcane.loadbalancer.server.port=3552
      - traefik.http.routers.arcane.rule=Host(`arcane.${TRAEFIK_BASE_DOMAIN}`)
      - traefik.http.routers.arcane.entrypoints=websecure
      - traefik.http.routers.arcane.tls=true
      - traefik.http.routers.arcane.tls.certresolver=cloudns

networks:
  proxynet:
    external: true
