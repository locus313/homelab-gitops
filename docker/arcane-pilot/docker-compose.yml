services:
  arcane-pilot:
    image: ghcr.io/corentinth/it-tools:2024.10.22-7ca5933
    container_name: arcane-pilot
    restart: unless-stopped
    networks:
      - proxynet
    environment:
      ARCANE_PILOT_VALUE: ${ARCANE_PILOT_VALUE}
      ARCANE_PILOT_SECRET_CANARY: ${ARCANE_PILOT_SECRET_CANARY:-canary-not-configured}
      TZ: ${TZ}
    volumes:
      - type: bind
        source: ./supporting-files
        target: /tmp/arcane-pilot-supporting-files
        read_only: true
        bind:
          create_host_path: true
    labels:
      - homelab.arcane-pilot.git-sync-test=1
      - traefik.enable=true
      - traefik.http.services.arcane-pilot.loadbalancer.server.port=80
      - traefik.http.routers.arcane-pilot.rule=Host(`arcane-pilot.${TRAEFIK_BASE_DOMAIN}`)
      - traefik.http.routers.arcane-pilot.entrypoints=websecure
      - traefik.http.routers.arcane-pilot.tls=true
      - traefik.http.routers.arcane-pilot.tls.certresolver=cloudns

networks:
  proxynet:
    external: true
