services:
  portainer:
    image: portainer/portainer-ce:2.45.4
    container_name: portainer
    restart: unless-stopped
    # Direct access for an approved rollback; Portainer uses a self-signed certificate.
    networks:
      - proxynet
    ports:
      - 9443:9443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Bind mount (not named volume) so Portainer state lives under DOCKER_BASE_PATH.
      - ${DOCKER_BASE_PATH}/portainer:/data
    environment:
      TZ: ${TZ}

networks:
  proxynet:
    external: true
